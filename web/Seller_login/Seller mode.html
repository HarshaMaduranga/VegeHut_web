
<!DOCTYPE html>
<html lang="en">
<head>
  <Style>

    /* Navigation */
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    

  .logo-title {
    display: flex;
    align-items: center;
    gap: 12px; 
}

.logo-title img {
    height: 60px; 
    width: auto;
}

.logo-title h1 {
    margin: 0;
    font-size: 2rem; 
    font-weight: bold;
    color: #49c26d;
}

    nav .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::before {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(135deg, #fafdfa, #2E7D32);
      transition: width 0.3s ease;
    }

    nav a:hover::before {
      width: 100%;
    }

    nav a:hover {
      color: #4CAF50;
    }

   
    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient( #4CAF50);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3); 
    }

    .btn-secondary {
      background: linear-gradient( #4CAF50);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    /* Sections */
    .section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-alt {
      background-color:#4CAF50;
      backdrop-filter: blur(20px);
      border-radius: 20px;
      margin: 10rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    .section h2 {
      font-size: 2.5rem;
      margin-bottom: 3rem;
      text-align: center;
      color: #f2efef;
      font-weight: 700;
    }

    /* Benefits */
    .benefits {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

  body {
  background: 
    linear-gradient(rgba(54, 54, 54, 0.5), rgba(0, 0, 0, 0.5)),
    url('5.jpg'); 
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
}

  </Style>
</head>
<body>
  <nav>
    <div class="logo-title">
      <img src="logo.png" alt="logo">
      <h1 class="text-xl font-bold text-gray-900">VegeHut</h1>
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="listings.html">Listings</a>
      <a href="vegehut_aboutus.html">About Us</a>
      <a href="signup.html">Seller Mode</a>
    </div>
  </nav>
  <div class="section" style="text-align: center; margin-top: 50px;">
  <h2><b>-SELLER ACCOUNT-</b></h2>
  <h2>Vegetable Management</h2>
  <div style="margin-top: 20px;">
    <form action="Add vegetables.html" style="display: inline-block; margin: 10px;">
      <button class="btn btn-primary" type="submit">Add Vegetable</button>
    </form>

    <form action="Vege details.html" style="display: inline-block; margin: 10px;">
      <button class="btn btn-secondary" type="submit">Vegetable Details</button>
    </form>
  </div>
</div>
</body>
</html>
