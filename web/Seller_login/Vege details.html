
<!DOCTYPE html>
<html lang="en">
<head>
  <Style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Navigation */
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }
.logo-title {
    display: flex;
    align-items: center;
    gap: 12px; 
}

.logo-title img {
    height: 60px; 
    width: auto;
}

.logo-title h1 {
    margin: 0;
    font-size: 2rem; 
    font-weight: bold;
    color: #49c26d; 
}

    nav .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::before {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(135deg, #fafdfa, #2E7D32);
      transition: width 0.3s ease;
    }

    nav a:hover::before {
      width: 100%;
    }

    nav a:hover {
      color: #4CAF50;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient( #4CAF50);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3); 
    }

    .btn-secondary {
      background: linear-gradient( #4CAF50);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }
    body {
  background: 
    linear-gradient(rgba(66, 66, 67, 0.5), rgba(100, 68, 68, 0.5)),
    url('3.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  height: 120vh;
  margin: 0;
  font-family: Arial, sans-serif;
  color: rgb(20, 20, 20);
}

  </Style>
</head>
<body>
  <nav>
    <div class="logo-title">
      <img src="logo.png" alt="logo">
      <h1 class="text-xl font-bold text-gray-900">VegeHut</h1>
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="listings.html">Listings</a>
      <a href="vegehut_aboutus.html">About Us</a>
      <a href="index.html">Logout</a>
    </div>
  </nav>
 <div style="max-width: 400px; margin: 50px auto; padding: 20px; background-color: #f9f9f9; border-radius: 10px;">
  <h2 style="text-align: center;"><u>-Vegetable Listing-</u></h2></br></br>

  <form action="#" method="POST">
    <label for="vegType">Vegetable Type:</label><br>
    <input type="text" id="vegType" name="vegType" placeholder="e.g., Carrot" required style="width: 100%; padding: 10px; margin-bottom: 15px;"><br>

    <label for="amount">Amount (kg):</label><br>
    <input type="number" id="amount" name="amount" placeholder="e.g., 100" required style="width: 100%; padding: 10px; margin-bottom: 15px;"><br>

    <label for="price">Price (Rs / kg):</label><br>
    <input type="number" id="price" name="price" placeholder="e.g., 250" required style="width: 100%; padding: 10px; margin-bottom: 15px;"><br>

    <label for="description">Description:</label><br>
    <textarea id="description" name="description" placeholder="Write something about your vegetables..." rows="4" required style="width: 100%; padding: 10px; margin-bottom: 15px;"></textarea><br>

     <form action="Listning page/add_listing.html" style="margin-top: 20px;">
    <button class="btn btn-primary" type="submit" style="width: 100%;">- Select Vegetable -</button>
  </form>

  <form action="listings.html" style="margin-top: 15px;">
    <button class="btn btn-secondary" type="submit" style="width: 100%;">- Update Vegetable - </button>
  </form>

  <form action="register.html" style="margin-top: 15px;">
    <button class="btn btn-secondary" type="submit" style="width: 100%;">- Delete vegetables -</button>
  </form>
</div>
</body>
</html>
