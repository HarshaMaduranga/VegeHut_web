<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login or Register</title>
  <style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #c5eac0 0%, #a8e6a3 30%, #8bc34a 70%, #4caf50 100%);
  background-attachment: fixed;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.container {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(248, 252, 248, 0.9));
  backdrop-filter: blur(25px);
  padding: 50px 40px;
  border-radius: 28px;
  box-shadow: 
    0 30px 60px rgba(0, 0, 0, 0.15),
    0 0 0 1px rgba(255, 255, 255, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
  width: 100%;
  max-width: 400px;
  position: relative;
  overflow: hidden;
  border: 3px solid rgba(76, 175, 80, 0.15);
  animation: containerEntrance 1s cubic-bezier(0.4, 0, 0.2, 1);
}


h2, h3 {
  color: #2E7D32;
  font-weight: 800;
  font-size: 2.2rem;
  margin-bottom: 35px;
  text-align: center;
  position: relative;
  text-shadow: 0 2px 8px rgba(46, 125, 50, 0.1);
  letter-spacing: -0.5px;
}

h3 {
  font-size: 2rem;
  margin-bottom: 30px;
}

/* Enhanced Input Fields */
input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"],
select {
  width: 100%;
  padding: 18px 24px;
  margin: 16px 0;
  border: 2px solid rgba(76, 175, 80, 0.2);
  border-radius: 16px;
  font-size: 1.1rem;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(10px);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-sizing: border-box;
  position: relative;
}

/* Enhanced Button Styling */
button {
  width: 100%;
  padding: 18px 28px;
  margin: 20px 0 10px 0;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #4CAF50 0%, #45a049 50%, #3d8b40 100%);
  color: white;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 
    0 12px 30px rgba(76, 175, 80, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

/* Enhanced Button Hover Effects */
button:hover {
  background: linear-gradient(135deg, #45a049 0%, #3d8b40 50%, #2e7d32 100%);
  transform: translateY(-4px) scale(1.02);
  box-shadow: 
    0 20px 40px rgba(76, 175, 80, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

button:active {
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
}



button:active::before {
  width: 350px;
  height: 350px;
}

/* Secondary Button (Log In) */
button:last-child {
  background: linear-gradient(135deg, #2196F3 0%, #1976D2 50%, #1565C0 100%);
  box-shadow: 
    0 12px 30px rgba(33, 150, 243, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  margin-top: 10px;
}

/* Link Styling inside Button */
button a {
  color: white;
  text-decoration: none;
  display: block;
  width: 100%;
  height: 100%;
  font-weight: 700;
  transition: all 0.3s ease;
}

  </style>
</head>
<body>

<form method="post" action="signup.php">
  <div class="container">
    <div id="registerForm">
      <h3>Sign In</h3>
      <input type="email" placeholder="Email" name="email" required ><br>
      <input type="password" placeholder="Password" name="password" required><br>
      <button type="submit">Sign In</button><br>
      <button><a href="Register.html">create account</a></button>
    </div>
  </div>
</form>

</body>
</html>
