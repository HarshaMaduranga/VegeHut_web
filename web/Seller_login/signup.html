<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login or Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #c5eac0ff;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 320px;
    }
    h2, h3 {
      margin-bottom: 15px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #50da2a;
      color: white;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<form method="post" action="signup.php">
  <div class="container">
    <div id="registerForm">
      <h3>Sign Up</h3>
      <input type="email" placeholder="Email" name="email" required><br>
      <input type="password" placeholder="Password" name="password" required><br>
      <button type="submit">Sign Up</button><br>
      <button><a href="Register.html">Log In</a></button>
    </div>
  </div>
</form>

</body>
</html>
