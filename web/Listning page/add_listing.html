<!DOCTYPE html>
<html>
<head>
  <title>Add New Listing</title>
  <style>
    body { font-family: Arial; background: #f0f8ff; padding: 20px; }
    form {
      
      background: white; padding: 20px; max-width: 400px; margin: auto;
      border-radius: 8px; box-shadow: 0 0 10px lightgray;
    }
    input, textarea { width: 90%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; background: green; color:black; }
  </style>
</head>
<body>
    <img src="addlist3.jpg"
            style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;">
    <h1><p style="color:black">Add Your Vegetable Listing</p></h1>
  <form>
    <input type="text" placeholder="Farmer Name" required>
    <input type="text" placeholder="Location" required>
    <input type="text" placeholder="Vegetable Type" required>
    <input type="number" placeholder="Amount (kg)" required>
    <input type="number" placeholder="Price (Rs/kg)" required>
    <input type="number" placeholder="Conatct number"required>
    <textarea placeholder="Description"></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
