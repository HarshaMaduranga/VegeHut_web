<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search - VegeHut.lk</title>
    <link rel="stylesheet" href="css/searchstyle.css">
</head>
<body>

    <header>
        <h1>Search for Vegetables</h1>
        <p>Find fresh produce from local farmers</p>
    </header>

    <div class="search-container">
        <form onsubmit="searchVegetables(event)">
            <input type="text" id="searchInput" placeholder="Enter vegetable name or location..." />
            <button type="submit">Search</button>
        </form>

        <div class="results" id="searchResults">
            <!-- Search results will appear here -->
        </div>
    </div>

    <script src="js/searchscript.js"></script>

</body>
</html>
